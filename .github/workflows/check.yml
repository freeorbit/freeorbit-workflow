name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      # The Actions runner has no user systemd, so this is the process runner, as on macOS.
      - run: node scripts/smoke.mjs
      - run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate .
      - run: claude plugin validate plugins/core

  # A team member on a Mac: the tests and the smoke run, with Chrome from /Applications.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: brew install imagemagick
      - run: npm test
      - run: node scripts/smoke.mjs
